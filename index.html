<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Age Number Colorizer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: calc(100% - 24px);
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .instructions {
      margin-bottom: 15px;
    }

    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-weight: bold;
      text-align: center;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Age Number Colorizer</h2>

    <p class="instructions">
      Insert an age number preferably from 1 to around 120. You can go above 120 if you so wish, but it will remain the same color throughout.
    </p>

    <label for="year-input">Year Number:</label>
    <input
      type="text"
      id="year-input"
      placeholder="Enter year number"
    />

    <label for="age-input">Age Number:</label>
    <input
      type="text"
      id="age-input"
      placeholder="Enter age number"
    />

    <div class="result" id="result"></div>
  </div>

  <script>
    function getColorFromRange(number) {
      if (number >= 101) return "#E11C26";
      if (number >= 91) return "#FF589D";
      if (number >= 81) return "#FA2073";
      if (number >= 71) return "#AC26F9";
      if (number >= 61) return "#2749D7";
      if (number >= 51) return "#2CA6E4";
      if (number >= 41) return "#21C896";
      if (number >= 31) return "#6DC823";
      if (number >= 21) return "#C7A91F";
      if (number >= 1) return "#EA8E00";

      return "#000000";
    }

    function formatYear(year) {
      if (year >= 1000 && year <= 9999) {
        return year.toString();
      }

      return year.toLocaleString();
    }

    function updateResult() {
      const yearInput = document
        .getElementById("year-input")
        .value
        .replace(/,/g, "");

      const ageInput = document
        .getElementById("age-input")
        .value
        .replace(/,/g, "");

      const resultBox = document.getElementById("result");

      if (
        yearInput.trim() === "" ||
        ageInput.trim() === "" ||
        isNaN(yearInput) ||
        isNaN(ageInput)
      ) {
        resultBox.innerHTML = "Please enter valid numbers.";
        return;
      }

      const year = Number(yearInput);
      const age = Number(ageInput);
      const resultingYear = year + age;
      const color = getColorFromRange(age);

      resultBox.innerHTML =
        `Age <span style="color:${color}">${age.toLocaleString()}</span> ` +
        `in <span style="color:${color}">${formatYear(resultingYear)}</span>`;
    }

    document
      .getElementById("year-input")
      .addEventListener("input", updateResult);

    document
      .getElementById("age-input")
      .addEventListener("input", updateResult);
  </script>
</body>
</html>
